<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚禮收禮＆座位速查系統（離線完整版）</title>
  <style>
    /* ==========================================================================
       1. 全域變數與基礎重設（完全內建 CSS，不依賴外部網路與 CDN）
       ========================================================================== */
    :root {
      --bg-page: #faf6ee;
      --bg-surface: #ffffff;
      --bg-cream-50: #fdfbf7;
      --bg-cream-100: #faf6ee;
      --bg-cream-200: #f2ead9;
      --border-cream: #e5d7be;
      --border-stone: #d6d3d1;
      --text-main: #1c1917;
      --text-body: #292524;
      --text-muted: #57534e;
      --text-subtle: #78716c;
      --amber-50: #fffbeb;
      --amber-100: #fef3c7;
      --amber-200: #fde68a;
      --amber-300: #fcd34d;
      --amber-600: #d97706;
      --amber-700: #b45309;
      --amber-800: #92400e;
      --amber-900: #78350f;
      --indigo-50: #eef2ff;
      --indigo-100: #e0e7ff;
      --indigo-200: #c7d2fe;
      --indigo-600: #4f46e5;
      --indigo-700: #4338ca;
      --indigo-800: #3730a3;
      --indigo-950: #1e1b4b;
      --rose-50: #fff1f2;
      --rose-100: #ffe4e6;
      --rose-200: #fecdd3;
      --rose-600: #e11d48;
      --rose-700: #be123c;
      --rose-800: #9f1239;
      --rose-900: #881337;
      --emerald-50: #ecfdf5;
      --emerald-100: #d1fae5;
      --emerald-200: #a7f3d0;
      --emerald-300: #6ee7b7;
      --emerald-800: #065f46;
      --emerald-900: #064e3b;
      --sky-50: #f0f9ff;
      --sky-100: #e0f2fe;
      --sky-200: #bae6fd;
      --sky-300: #7dd3fc;
      --sky-800: #075985;
      --sky-900: #0c4a6e;
      --stone-50: #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e7e5e4;
      --stone-300: #d6d3d1;
      --stone-700: #44403c;
      --stone-800: #292524;
      --stone-900: #1c1917;
      --shadow-xs: 0 1px 2px rgba(28, 25, 23, 0.05);
      --shadow-sm: 0 2px 6px rgba(28, 25, 23, 0.07);
      --shadow-lg: 0 10px 25px rgba(28, 25, 23, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-body);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select {
      font-family: inherit;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px;
    }

    @media (min-width: 640px) {
      .container {
        padding-left: 24px;
        padding-right: 24px;
      }
    }

    /* ==========================================================================
       2. 頂部標題與 Excel 檔案操作列
       ========================================================================== */
    .app-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-cream);
      box-shadow: var(--shadow-xs);
    }

    .header-inner {
      padding-top: 14px;
      padding-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .header-inner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--amber-600), var(--amber-800));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-xs);
      flex-shrink: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    @media (min-width: 640px) {
      .brand-title {
        font-size: 1.45rem;
      }
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background-color: var(--amber-100);
      color: var(--amber-800);
      border: 1px solid var(--amber-200);
    }

    .source-badge.is-imported {
      background-color: var(--emerald-100);
      color: var(--emerald-800);
      border-color: var(--emerald-200);
    }

    .brand-subtitle {
      margin: 3px 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      text-decoration: none;
      user-select: none;
      flex: 1 1 auto;
    }

    @media (min-width: 640px) {
      .btn-action {
        flex: 0 0 auto;
      }
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-sample {
      background-color: var(--bg-cream-100);
      color: var(--stone-700);
      border: 1px solid var(--border-cream);
    }

    .btn-sample:hover {
      background-color: var(--bg-cream-200);
    }

    .btn-import {
      background-color: var(--stone-900);
      color: #ffffff;
      border: 1px solid var(--stone-900);
      box-shadow: var(--shadow-xs);
    }

    .btn-import:hover {
      background-color: var(--stone-800);
    }

    .btn-reset-sample {
      background-color: var(--rose-50);
      color: var(--rose-800);
      border: 1px solid var(--rose-200);
    }

    .btn-reset-sample:hover {
      background-color: var(--rose-100);
    }

    /* ==========================================================================
       3. 置頂固定：搜尋與多欄位篩選控制區
       ========================================================================== */
    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: rgba(253, 251, 247, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-cream);
      box-shadow: var(--shadow-sm);
    }

    .filter-inner {
      padding-top: 12px;
      padding-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 第一排：搜尋框（字體設為 16px 防止 iOS Safari 點擊時自動放大畫面） */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--amber-700);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 44px 10px 44px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      background-color: var(--bg-surface);
      border: 2px solid var(--border-stone);
      border-radius: 16px;
      outline: none;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input::placeholder {
      font-weight: 400;
      color: #a8a29e;
      font-size: 0.92rem;
    }

    .search-input:focus {
      border-color: var(--amber-600);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15);
    }

    .input-clear-btn {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .input-clear-btn:hover {
      background-color: var(--stone-100);
      color: var(--text-main);
    }

    /* 第二排：篩選控制列 */
    .filter-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 960px) {
      .filter-controls {
        flex-direction: row;
        align-items: center;
      }
    }

    /* 1. 男方 / 女方 左右各半雙拼按鈕 */
    .side-toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 2px solid var(--border-stone);
      background-color: var(--bg-surface);
      overflow: hidden;
      flex-shrink: 0;
    }

    @media (min-width: 960px) {
      .side-toggle-group {
        width: 210px;
      }
    }

    .side-btn {
      border: none;
      background-color: var(--bg-surface);
      color: var(--stone-700);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .side-btn-groom {
      border-right: 1px solid var(--border-stone);
    }

    .side-btn-groom:hover {
      background-color: var(--indigo-50);
    }

    .side-btn-bride:hover {
      background-color: var(--rose-50);
    }

    .side-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .side-dot-groom {
      background-color: var(--indigo-600);
    }

    .side-dot-bride {
      background-color: var(--rose-600);
    }

    .side-btn-groom.is-active {
      background-color: var(--indigo-700);
      color: #ffffff;
      font-weight: 900;
    }

    .side-btn-groom.is-active .side-dot {
      background-color: var(--amber-300);
    }

    .side-btn-bride.is-active {
      background-color: var(--rose-600);
      color: #ffffff;
      font-weight: 900;
    }

    .side-btn-bride.is-active .side-dot {
      background-color: var(--amber-300);
    }

    /* 2. 關係下拉選單 */
    .select-wrapper {
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }

    @media (min-width: 960px) {
      .select-wrapper {
        width: 200px;
      }
    }

    .relation-select {
      width: 100%;
      min-height: 44px;
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--bg-surface);
      border: 2px solid var(--border-stone);
      border-radius: 12px;
      padding: 8px 36px 8px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--stone-700);
      outline: none;
      cursor: pointer;
    }

    .relation-select:focus {
      border-color: var(--amber-600);
    }

    .select-chevron {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* 3. 姓名注音分組複合輸入＋下拉選單 */
    .zhuyin-combo {
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }

    @media (min-width: 960px) {
      .zhuyin-combo {
        width: 250px;
      }
    }

    .zhuyin-input {
      width: 100%;
      min-height: 44px;
      background-color: var(--bg-surface);
      border: 2px solid var(--border-stone);
      border-radius: 12px;
      padding: 8px 66px 8px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }

    .zhuyin-input::placeholder {
      font-weight: 500;
      color: var(--text-subtle);
    }

    .zhuyin-input:focus {
      border-color: var(--amber-600);
    }

    .zhuyin-clear-btn {
      position: absolute;
      top: 50%;
      right: 36px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .zhuyin-clear-btn:hover {
      background-color: var(--stone-100);
      color: var(--text-main);
    }

    .zhuyin-toggle-btn {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .zhuyin-toggle-btn:hover {
      background-color: var(--stone-100);
      color: var(--text-main);
    }

    .zhuyin-dropdown {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      max-height: 260px;
      overflow-y: auto;
      background-color: var(--bg-surface);
      border: 2px solid var(--stone-200);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      z-index: 40;
      padding: 6px 0;
    }

    .zhuyin-option-btn {
      width: 100%;
      border: none;
      background: transparent;
      padding: 9px 14px;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-body);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .zhuyin-option-btn:hover {
      background-color: var(--amber-50);
    }

    .zhuyin-option-btn.is-selected {
      background-color: var(--amber-100);
      color: var(--amber-900);
    }

    .zhuyin-option-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zhuyin-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background-color: var(--bg-cream-200);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .count-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: var(--stone-100);
      color: var(--text-muted);
    }

    .dropdown-empty {
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--text-subtle);
      text-align: center;
    }

    /* 4. 最右側清除按鈕 */
    .btn-clear-all {
      width: 100%;
      min-height: 44px;
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-stone);
      background-color: var(--stone-200);
      color: var(--stone-700);
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    @media (min-width: 960px) {
      .btn-clear-all {
        width: auto;
        margin-left: auto;
      }
    }

    .btn-clear-all:hover {
      background-color: var(--stone-300);
    }

    .btn-clear-all.has-filters {
      background-color: var(--amber-700);
      border-color: var(--amber-700);
      color: #ffffff;
      font-weight: 900;
    }

    .btn-clear-all.has-filters:hover {
      background-color: var(--amber-800);
    }

    /* ==========================================================================
       4. 主內容區：即時統計列與賓客資訊卡片
       ========================================================================== */
    .main-content {
      padding-top: 18px;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stats-bar {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-cream);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stats-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats-label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stats-groups {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .filter-active-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background-color: var(--amber-100);
      color: var(--amber-800);
    }

    .stats-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .stat-chip strong {
      font-size: 0.98rem;
      font-weight: 900;
    }

    .stat-chip-people {
      background-color: var(--stone-100);
      color: var(--stone-700);
    }

    .stat-chip-cake {
      background-color: var(--amber-50);
      color: var(--amber-800);
      border: 1px solid var(--amber-200);
    }

    .stat-chip-veg {
      background-color: var(--emerald-50);
      color: var(--emerald-800);
      border: 1px solid var(--emerald-200);
    }

    .stat-chip-chair {
      background-color: var(--sky-50);
      color: var(--sky-800);
      border: 1px solid var(--sky-200);
    }

    /* 賓客列表與卡片 */
    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .guest-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-cream);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s ease;
    }

    .guest-card:hover {
      border-color: var(--amber-600);
    }

    .guest-card-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .guest-card-inner {
        flex-direction: row;
        align-items: center;
        gap: 18px;
      }
    }

    /* 座位大字方塊 */
    .table-box {
      flex-shrink: 0;
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      color: #ffffff;
      background-color: var(--stone-900);
      border: 1px solid var(--stone-700);
      box-shadow: var(--shadow-xs);
    }

    @media (min-width: 640px) {
      .table-box {
        width: 142px;
        padding: 12px 10px;
        flex-direction: column;
        justify-content: center;
      }
    }

    .table-box.is-groom {
      background-color: var(--indigo-950);
      border-color: var(--indigo-800);
    }

    .table-box.is-bride {
      background-color: var(--rose-900);
      border-color: var(--rose-700);
    }

    .table-box-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }

    .table-box-value {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    @media (min-width: 640px) {
      .table-box-value {
        font-size: 1.5rem;
        margin-top: 2px;
      }
    }

    .guest-main {
      flex: 1;
      min-width: 0;
    }

    .guest-top-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 820px) {
      .guest-top-row {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .guest-identity {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .guest-name {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    mark.hl {
      background-color: var(--amber-200);
      color: #000000;
      border-radius: 4px;
      padding: 0 2px;
      font-weight: 900;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .badge-nickname {
      background-color: var(--amber-100);
      color: var(--amber-900);
      border: 1px solid var(--amber-300);
    }

    .badge-nickname-prefix {
      color: var(--amber-700);
      font-weight: 700;
    }

    .badge-zhuyin {
      background-color: var(--bg-cream-200);
      color: var(--text-body);
      border: 1px solid var(--border-cream);
      font-weight: 900;
    }

    .badge-side-groom {
      background-color: var(--indigo-100);
      color: var(--indigo-800);
      border: 1px solid var(--indigo-200);
    }

    .badge-side-bride {
      background-color: var(--rose-100);
      color: var(--rose-800);
      border: 1px solid var(--rose-200);
    }

    .badge-side-neutral {
      background-color: var(--stone-100);
      color: var(--stone-700);
      border: 1px solid var(--stone-200);
    }

    .badge-relation {
      background-color: var(--stone-100);
      color: var(--stone-700);
      border: 1px solid var(--stone-200);
      font-weight: 700;
    }

      flex-wrap: wrap;
      align-items: center;
      gap: 8px;

    }

      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;

      background-color: var(--stone-100);
      color: var(--text-body);
      border: 1px solid var(--stone-200);
    }

    .need-cake-yes {
      background-color: var(--amber-100);
      color: var(--amber-900);
      border: 1px solid var(--amber-300);
      font-weight: 900;
    }

    .need-cake-no {
      background-color: var(--stone-50);
      color: #a8a29e;
      border: 1px solid var(--stone-200);
      font-weight: 600;

      background-color: var(--emerald-100);
      color: var(--emerald-900);
      border: 1px solid var(--emerald-300);
      font-weight: 900;

      background-color: var(--sky-100);
      color: var(--sky-900);
      border: 1px solid var(--sky-300);
      font-weight: 900;

      align-items: center;
      gap: 8px;

      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      background-color: var(--bg-cream-100);
      color: var(--stone-700);
      border: 1px solid var(--border-cream);

    .extra-tag strong {
      color: #5e482a;
      font-weight: 800;
    }

       5. 空狀態、拖曳遮罩與 Toast 通知

    .empty-box {
      background-color: var(--bg-surface);
      border: 2px dashed var(--border-cream);
      border-radius: 24px;
      padding: 44px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background-color: var(--bg-cream-100);
      color: #a8a29e;
      display: flex;
      align-items: center;
      justify-content: center;

    .empty-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-body);
    }

    .empty-desc {
      margin: 6px 0 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .empty-btn {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background-color: var(--amber-700);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .empty-btn:hover {
      background-color: var(--amber-800);
    }

    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(28, 25, 23, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
    }

    .drop-card {
      background-color: var(--bg-surface);
      border: 4px dashed var(--amber-600);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 16px;
      left: 16px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .toast-item {
      pointer-events: auto;
      max-width: 380px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      background-color: var(--stone-900);
      color: #ffffff;
      border: 1px solid var(--stone-700);
      box-shadow: var(--shadow-lg);
      font-size: 0.875rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-item.is-error {
      background-color: var(--rose-700);
      border-color: var(--rose-800);
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--amber-300);
      flex-shrink: 0;
    }

    .toast-item.is-error .toast-dot {
      background-color: var(--rose-200);
    }

</head>
<body>

  <!-- 拖曳匯入 Excel 的全螢幕視覺提示遮罩 -->
  <div id="dropOverlay" class="drop-overlay hidden">

          <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />

            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />

    </div>
  </header>

  <!-- 置頂固定：核心搜尋與篩選控制區 -->
  <section class="filter-bar">

      <!-- 第一排：即時搜尋欄位（邊打邊找、支援多字注音與綽號） -->

          id="searchInput"

          autocomplete="off"
